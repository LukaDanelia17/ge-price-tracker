name: crawl

# Both stores answer GitHub-hosted runners with 403 (Cloudflare blocks
# datacenter IPs), so the scheduled crawl runs from launchd on the Mac
# (scripts/install_schedule.sh). Kept for manual runs / a self-hosted runner.
on:
  workflow_dispatch:
  # 04:00 / 16:00 UTC = 08:00 / 20:00 Tbilisi.
  # schedule:
  #   - cron: "0 4 * * *"
  #   - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -q

      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m gept.run
