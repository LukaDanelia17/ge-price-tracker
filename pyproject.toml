[project]
name = "ge-price-tracker"
version = "0.1.0"
description = "Price history collector for Georgian electronics stores"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only for the opt-in alta.ge fetcher (dropped for Phase 1).
alta = ["playwright>=1.45"]

[tool.setuptools]
packages = ["gept"]

[tool.setuptools.package-data]
gept = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
