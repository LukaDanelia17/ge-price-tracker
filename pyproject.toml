[project]
name = "ge-price-tracker"
version = "0.1.0"
description = "Price history collector for Georgian electronics stores"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gept"]

[tool.setuptools.package-data]
gept = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import gept from the checkout even if the editable install's .pth is
# skipped (Python 3.13 ignores .pth files macOS has flagged hidden).
pythonpath = ["."]
